name: post-reel
# Post time: 09:00, 13:00, 19:00 IST. Video build-reel ne 2h pehle bana diya hota hai.
on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 7 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: morning / noon / evening
        required: true
permissions:
  contents: write
  actions: read
concurrency: reel-autopilot
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'graph.facebook.com' }}
      FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick slot
        id: slot
        run: |
          H=$(TZ=Asia/Kolkata date +%H)
          S="${{ github.event.inputs.slot }}"
          if [ -z "$S" ]; then if [ "$H" -lt 11 ]; then S=morning; elif [ "$H" -lt 16 ]; then S=noon; else S=evening; fi; fi
          echo "slot=$S" >> $GITHUB_OUTPUT
      - name: Fetch ready reel
        id: fetch
        run: |
          NAME="ready-${{ steps.slot.outputs.slot }}-$(TZ=Asia/Kolkata date +%F)"
          ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$NAME&per_page=1" --jq '.artifacts[0].id // empty')
          if [ -n "$ID" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$ID/zip" > r.zip && mkdir -p ready && unzip -q r.zip -d ready
            echo "found=1" >> $GITHUB_OUTPUT
          else
            echo "no ready reel ($NAME) - fallback: build now"; echo "found=0" >> $GITHUB_OUTPUT
          fi
      - name: Post on time
        if: steps.fetch.outputs.found == '1'
        run: |
          V=$(ls ready/*/reel.mp4 | head -1)
          export PUBLIC_VIDEO_URL=$(tools/media_host.sh "$V" "$(basename $(dirname $V)).mp4")
          python3 tools/post_ready.py ready
      - name: Fallback setup
        if: steps.fetch.outputs.found != '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q pillow numpy fonttools faster-whisper
      - name: Fallback build + post
        if: steps.fetch.outputs.found != '1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/run_slot.py --slot ${{ steps.slot.outputs.slot }} --build-only && V=$(ls ready/*/reel.mp4 | head -1) && export PUBLIC_VIDEO_URL=$(tools/media_host.sh "$V" "$(basename $(dirname $V)).mp4") && python3 tools/post_ready.py ready
      - name: Insights
        if: always()
        run: cd tools && python3 insights.py || true
      - name: Commit
        if: always()
        run: |
          git config user.name "reel-autopilot"
          git config user.email "reel-autopilot@users.noreply.github.com"
          git add -A specs posted data
          git commit -m "post: ${{ steps.slot.outputs.slot }} $(date -u +%F)" || exit 0
          git pull --rebase && git push

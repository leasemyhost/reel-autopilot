name: post-reel
on:
  schedule:
    - cron: "30 3 * * *"    # 09:00 IST
    - cron: "30 7 * * *"    # 13:00 IST
    - cron: "30 13 * * *"   # 19:00 IST
  workflow_dispatch:
    inputs:
      slot:
        description: morning / noon / evening
        required: false
permissions:
  contents: write
concurrency: post-reel
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick slot
        id: slot
        run: |
          H=$(TZ=Asia/Kolkata date +%H)
          S="${{ github.event.inputs.slot }}"
          if [ -z "$S" ]; then if [ "$H" -lt 11 ]; then S=morning; elif [ "$H" -lt 16 ]; then S=noon; else S=evening; fi; fi
          echo "slot=$S" >> $GITHUB_OUTPUT
      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'graph.instagram.com' }}
        run: python3 tools/post_instagram.py --slot ${{ steps.slot.outputs.slot }}
      - name: Insights
        if: always()
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'graph.instagram.com' }}
        run: cd tools && python3 insights.py || true
      - name: Commit
        if: always()
        run: |
          git config user.name "reel-autopilot"
          git config user.email "reel-autopilot@users.noreply.github.com"
          git add -A queue posted data || true
          git commit -m "post: ${{ steps.slot.outputs.slot }} $(date -u +%F)" || exit 0
          git pull --rebase && git push

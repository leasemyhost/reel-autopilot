name: build-and-post-reel
on:
  schedule:
    - cron: "35 3 * * *"    # ~09:05 IST post (build starts 09:05, posts ~09:15)
    - cron: "35 7 * * *"    # ~13:05 IST
    - cron: "35 13 * * *"   # ~19:05 IST
  workflow_dispatch:
    inputs:
      slot:
        description: morning / noon / evening
        required: false
      no_post:
        description: "true = sirf video banao, post mat karo (test)"
        required: false
        default: "false"
permissions:
  contents: write
concurrency: reel-autopilot
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q pillow numpy fonttools faster-whisper
      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Pick slot
        id: slot
        run: |
          H=$(TZ=Asia/Kolkata date +%H)
          S="${{ github.event.inputs.slot }}"
          if [ -z "$S" ]; then if [ "$H" -lt 11 ]; then S=morning; elif [ "$H" -lt 16 ]; then S=noon; else S=evening; fi; fi
          echo "slot=$S" >> $GITHUB_OUTPUT
      - name: Voice + render + post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'graph.facebook.com' }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.no_post }}" = "true" ]; then NP=--no-post; else NP=; fi
          python3 tools/run_slot.py --slot ${{ steps.slot.outputs.slot }} $NP
      - name: Upload video (artifact, 7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.slot.outputs.slot }}-${{ github.run_id }}
          path: build/*/reel.mp4
          retention-days: 7
          if-no-files-found: ignore
      - name: Insights
        if: always()
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'graph.facebook.com' }}
        run: cd tools && python3 insights.py || true
      - name: Commit
        if: always()
        run: |
          git config user.name "reel-autopilot"
          git config user.email "reel-autopilot@users.noreply.github.com"
          git add -A specs posted data
          git commit -m "reel: ${{ steps.slot.outputs.slot }} $(date -u +%F)" || exit 0
          git pull --rebase && git push

name: upload-test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload sample reel as container (no publish)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_HOST: graph.facebook.com
          GH_TOKEN: ${{ github.token }}
        run: |
          export PUBLIC_VIDEO_URL=$(tools/media_host.sh tests/sample.mp4 test-sample.mp4)
          echo "url: $PUBLIC_VIDEO_URL"
          python3 tools/upload_test.py tests/sample.mp4

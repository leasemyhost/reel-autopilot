name: upload-test
on:
  workflow_dispatch:
    inputs:
      ig_user_id:
        description: IG user id (khali = main account)
        required: false
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Container test (never publishes)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ github.event.inputs.ig_user_id || secrets.IG_USER_ID }}
          IG_GRAPH_HOST: graph.facebook.com
          GH_TOKEN: ${{ github.token }}
        run: |
          A=$(tools/media_host.sh tests/sample.mp4 test-sample.mp4)
          python3 tools/upload_test.py orig=$A
          gh release delete-asset media test-sample.mp4 -R ${{ github.repository }} -y || true

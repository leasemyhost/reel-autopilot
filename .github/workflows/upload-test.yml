name: upload-test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload sample reel as container (no publish)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_HOST: graph.facebook.com
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -v error -y -i tests/sample.mp4 -c:v libx264 -profile:v high -level 4.0 -pix_fmt yuv420p -r 30 -b:v 3500k -maxrate 5000k -bufsize 10M -c:a aac -b:a 128k -ar 44100 -ac 2 -movflags +faststart /tmp/safe.mp4
          A=$(tools/media_host.sh tests/sample.mp4 test-sample.mp4)
          B=$(tools/media_host.sh /tmp/safe.mp4 test-safe.mp4)
          python3 tools/upload_test.py orig=$A safe=$B

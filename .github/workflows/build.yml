name: build-reel
# 2 ghante pehle video ready: 07:00, 11:00, 17:00 IST
on:
  schedule:
    - cron: "23 1 * * *"    # 06:53 IST
    - cron: "53 1 * * *"    # retry
    - cron: "23 5 * * *"    # 10:53 IST
    - cron: "53 5 * * *"
    - cron: "23 11 * * *"   # 16:53 IST
    - cron: "53 11 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: morning / noon / evening
        required: true
permissions:
  contents: write
concurrency: reel-autopilot
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q pillow numpy fonttools faster-whisper
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Pick slot
        id: slot
        run: |
          H=$(TZ=Asia/Kolkata date +%H)
          S="${{ github.event.inputs.slot }}"
          if [ -z "$S" ]; then if [ "$H" -lt 9 ]; then S=morning; elif [ "$H" -lt 14 ]; then S=noon; else S=evening; fi; fi
          echo "slot=$S" >> $GITHUB_OUTPUT
          echo "day=$(TZ=Asia/Kolkata date +%F)" >> $GITHUB_OUTPUT
      - name: Voice + render
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/run_slot.py --slot ${{ steps.slot.outputs.slot }} --build-only
      - name: Save ready reel
        uses: actions/upload-artifact@v4
        with:
          name: ready-${{ steps.slot.outputs.slot }}-${{ steps.slot.outputs.day }}
          path: ready/
          retention-days: 3
          if-no-files-found: ignore
      - name: Commit
        if: always()
        run: |
          git config user.name "reel-autopilot"
          git config user.email "reel-autopilot@users.noreply.github.com"
          git add -A specs posted data
          git commit -m "build: ${{ steps.slot.outputs.slot }} ${{ steps.slot.outputs.day }}" || exit 0
          git pull --rebase && git push

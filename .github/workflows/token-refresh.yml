name: token-check
on:
  schedule:
    - cron: "0 4 */7 * *"
  workflow_dispatch:
permissions:
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check system-user token still works (never-expiring, but can be revoked)
        env:
          TOK: ${{ secrets.IG_ACCESS_TOKEN }}
          UID: ${{ secrets.IG_USER_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          R=$(curl -s "https://graph.facebook.com/v22.0/$UID?fields=id,username&access_token=$TOK")
          echo "$R" | grep -q '"username"' && echo "token ok" && exit 0
          gh issue create -R "$GITHUB_REPOSITORY" -t "Instagram token kaam nahi kar raha - naya token chahiye" -b "Response: $(echo $R | head -c 300)" || true
          exit 1
